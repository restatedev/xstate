  esbuild: false
  protobufjs: false
  ssh2: false

catalog:
  "@restatedev/restate-sdk": ^1.16.1
  "@restatedev/restate-sdk-clients": ^1.16.1
  "@restatedev/restate-sdk-testcontainers": ^1.16.1
  xstate: ^5.20.1

minimumReleaseAgeExclude:
